name: Validate account and auth changes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-public-test-key
      VITE_PLAID_MOCK_MODE: 'true'
      VITE_NEON_DATABASE_URL: PRIVATE_DB_SENTINEL_NOT_A_CREDENTIAL
      PLAID_SECRET: PRIVATE_PLAID_SENTINEL_NOT_A_CREDENTIAL
      VERCEL_ARTIFACTS_TOKEN: PRIVATE_ARTIFACT_SENTINEL_NOT_A_CREDENTIAL
      VERCEL_ENV_ENC_KEY: PRIVATE_ENV_SENTINEL_NOT_A_CREDENTIAL
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Exclude committed environment files from test build
        # Do not read or print their contents. This only affects the ephemeral checkout.
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, unlinkSync } from 'node:fs';
          for (const name of readdirSync('.')) {
            if ((name === '.env' || name.startsWith('.env.')) && name !== '.env.example') unlinkSync(name);
          }
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm run test:focused
      - run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Build with synthetic public settings
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Scan generated assets for private sentinel leakage
        if: ${{ !cancelled() }}
        run: npm run check:bundle
      - name: Rendered browser integration with mocked auth
        if: ${{ !cancelled() }}
        run: npm run test:browser
      - name: Rendered app-open reminder integration (mocked preferences)
        if: ${{ !cancelled() }}
        run: npm run test:reminders-browser

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: chorecoins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chorecoins_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test actual ownership RLS, RPC atomicity and conflicts on disposable Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/chorecoins_test
          ALLOW_DISPOSABLE_DB_BOOTSTRAP: 'yes'
        run: bash tests/database/run.sh
